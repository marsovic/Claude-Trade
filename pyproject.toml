[project]
name = "survival-trading-bot"
version = "2.0.0"
description = "Open-source Binance futures trading bot that starts with 50 USDT and stops forever if it loses them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
"bot/trading_bot.py" = ["E402"]
"bot/backtest.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
