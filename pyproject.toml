[project]
name = "claude-trade"
version = "1.0.0"
description = "Small-capital trading bots (US stocks, crypto) with a survival rule, and the research tools that test their rules."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
"bot/trading_bot.py" = ["E402"]
"bot/backtest.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
